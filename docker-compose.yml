services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: job_search
      POSTGRES_USER: jobs
      POSTGRES_PASSWORD: jobs_dev_password
    ports: ["5432:5432"]
    volumes: [job_search_pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobs -d job_search"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  job_search_pgdata:
